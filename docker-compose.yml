services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_sales_coach_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_sales_coach
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_sales_coach"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
